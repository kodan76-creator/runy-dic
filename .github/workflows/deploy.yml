name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# 🔒 Сериализуем деплои: GitHub Pages разрешает только один деплой за раз.
# Если новый запуск приходит во время уже идущего — он отменяет старый
# и сам доходит до конца (без ложных failure "due to in progress deployment").
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  # 🧿 Проверяем, изменились ли только data-файлы, которые приложение читает
  # в рантайме через GitHub API (runes.json, словари и т.п.). Для них
  # пересборка статического сайта не нужна — деплой пропускаем.
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        name: Detect relevant changes
        run: |
          # Файлы данных, читаемые в рантайме через API (не влияют на сборку сайта)
          DATA_FILES="runes.json categories.json users.json admins.json logs.json favorites.json favorites_queue.json dictionary.json test.json citer2380.json kodan76.json winx0212.json ya.kodan76.json ya.kostima11.json"

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          # Первый пуш в ветку (before = 0000…) — всегда деплоим
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Первый пуш — деплоим."
            echo "deploy=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # merge-base корректно работает и при rebase-пушах (before/after расходятся,
          # старый before переписывается и недоступен), и при обычных fast-forward пушах.
          BASE=$(git merge-base "$BEFORE" "$AFTER" 2>/dev/null || echo "$BEFORE")
          changed=$(git diff --name-only "$BASE" "$AFTER" || true)
          echo "Changed files in this push (base=$BASE):"
          echo "$changed"

          need_deploy=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            is_data=0
            for d in $DATA_FILES; do
              if [ "$f" = "$d" ]; then is_data=1; break; fi
            done
            # Загруженные пользователями медиа-файлы тоже data (не влияют на сборку)
            case "$f" in
              public/audio/*) is_data=1 ;;
            esac
            if [ "$is_data" -eq 0 ]; then need_deploy=1; fi
          done <<< "$changed"

          echo "Need deploy: $need_deploy"
          echo "deploy=$need_deploy" >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    if: needs.changes.outputs.deploy == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
        env:
          VITE_GITHUB_TOKEN: ${{ secrets.GH_PAT }}  # ← Изменено!
          VITE_ENCRYPTION_KEY: ${{ vars.ENCRYPTION_KEY }}
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # 🧹 Best-effort: снимаем зависшие деплои Pages, чтобы actions/deploy-pages
      # не упал с "due to in progress deployment". Если API списка недоступен
      # (возвращает 404), шаг просто ничего не делает и не ломает сборку.
      - name: Cancel stuck Pages deployments
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments?per_page=100" \
            2>/dev/null | jq -r '.[]? | select(.status=="in_progress" or .status=="queued" or .status=="pending") | .id' || true)
          for id in $ids; do
            echo "Отменяем зависший деплой Pages #$id ..."
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments/$id/cancel" 2>/dev/null || true
          done
          [ -n "$ids" ] && sleep 15 || true

      # 🚀 Официальный экшен деплоя. Использует внутренний API Pages и корректно
      # работает с GITHUB_TOKEN (pages:write). Конкурентность (concurrency выше)
      # гарантирует, что одновременно идёт только один деплой — это исключает
      # гонки на уровне сервиса Pages, из-за которых деплой мог "зависать".
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4