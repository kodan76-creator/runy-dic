name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  actions: read
  id-token: write

# 🔒 Сериализуем деплои: GitHub Pages разрешает только один деплой за раз.
# Если новый запуск приходит во время уже идущего — он отменяет старый
# и сам доходит до конца (без ложных failure "due to in progress deployment").
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  # 🧿 Проверяем, изменились ли только data-файлы, которые приложение читает
  # в рантайме через GitHub API (runes.json, словари и т.п.). Для них
  # пересборка статического сайта не нужна — деплой пропускаем.
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        name: Detect relevant changes
        run: |
          # Файлы данных, читаемые в рантайме через API (не влияют на сборку сайта)
          DATA_FILES="runes.json categories.json users.json admins.json logs.json favorites.json favorites_queue.json dictionary.json test.json citer2380.json kodan76.json winx0212.json ya.kodan76.json ya.kostima11.json"

          changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.event.after }}" || true)
          echo "Changed files in this push:"
          echo "$changed"

          need_deploy=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            is_data=0
            for d in $DATA_FILES; do
              if [ "$f" = "$d" ]; then is_data=1; break; fi
            done
            # Загруженные пользователями медиа-файлы тоже data (не влияют на сборку)
            case "$f" in
              public/audio/*) is_data=1 ;;
            esac
            if [ "$is_data" -eq 0 ]; then need_deploy=1; fi
          done <<< "$changed"

          echo "Need deploy: $need_deploy"
          echo "deploy=$need_deploy" >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    if: needs.changes.outputs.deploy == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
        env:
          VITE_GITHUB_TOKEN: ${{ secrets.GH_PAT }}  # ← Изменено!
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      
      # 🔓 Надёжный деплой: снимаем зависшие деплои Pages, создаём новый,
      # ждём завершения и повторяем при неудаче. Используем curl + GITHUB_TOKEN
      # (имеет pages:write), чтобы не зависеть от actions/deploy-pages, который
      # падает с "due to in progress deployment" при гонках на уровне сервиса.
      - name: Deploy to GitHub Pages (with retry)
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "User-Agent: curl" "$@"; }

          cancel_stuck() {
            echo "Проверяем зависшие деплои Pages..."
            ids=$(api "https://api.github.com/repos/$REPO/pages/deployments?per_page=100" | jq -r '.[] | select(.status=="in_progress" or .status=="queued" or .status=="pending") | .id')
            for id in $ids; do
              echo "Отменяем зависший деплой Pages #$id ..."
              api -X POST "https://api.github.com/repos/$REPO/pages/deployments/$id/cancel" >/dev/null || true
            done
            [ -n "$ids" ] && sleep 15 || true
          }

          for attempt in 1 2 3 4 5; do
            cancel_stuck
            echo "Получаем artifact github-pages..."
            art_id=$(api "https://api.github.com/repos/$REPO/actions/artifacts?per_page=100" | jq -r '.artifacts[] | select(.name=="github-pages") | .id' | head -n1)
            echo "Artifact id: $art_id"
            echo "Создаём деплой (попытка $attempt)..."
            dep_id=$(api -X POST "https://api.github.com/repos/$REPO/pages/deployments" \
              -H "Content-Type: application/json" \
              -d "{\"artifact_id\":$art_id,\"environment\":\"github-pages\",\"preview\":false}" \
              | jq -r '.id')
            echo "Deployment id: $dep_id"
            ok=0
            for i in $(seq 1 60); do
              st=$(api "https://api.github.com/repos/$REPO/pages/deployments/$dep_id" | jq -r '.status')
              echo "  статус: $st ($i/60)"
              if [ "$st" = "succeeded" ]; then ok=1; break; fi
              if [ "$st" = "failed" ]; then break; fi
              sleep 10
            done
            if [ "$ok" -eq 1 ]; then echo "✅ Деплой успешен."; exit 0; fi
            echo "⚠️ Попытка $attempt не удалась, повторяем..."
            sleep 10
          done
          echo "❌ Все попытки деплоя не удались."; exit 1