name: Migrate Encryption

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Run migration
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          LEGACY_PASSPHRASES: ${{ secrets.LEGACY_PASSPHRASES }}
        run: |
          set -e
          BRANCH=migration/encryption-$(date -u +%Y%m%dT%H%M%SZ)
          git checkout -b "$BRANCH"
          node scripts/migrate-encryption.cjs --apply
          git add --all '*.json'
          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "migrate: re-encrypt JSON files (automated)"
          git push origin "$BRANCH"

      - name: Output branch name
        run: echo "Migration branch created"
