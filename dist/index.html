<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/png" href="./golub.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- 🟣 Цвет интерфейса браузера — фиолетовый в обеих темах (без серых) -->
    <meta name="theme-color" content="#7b1fa2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#331a4f" />
    <title>Мой Словарь</title>
    <script>
      // Применяем тему до загрузки CSS/бандла, чтобы не мигала неверная тема.
      (function () {
        try {
          var t = localStorage.getItem('runy-dic-theme')
          if (t !== 'light' && t !== 'dark') {
            t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', t || 'light')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <script type="module" crossorigin src="/assets/index-E-mZXBHt.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CFSgpVAr.css">
  </head>

    <div id="root"></div>
  </body>
</html>
